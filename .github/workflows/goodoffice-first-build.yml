name: GoodOffice first macOS test build

on:
  push:
    branches: ['goodoffice-first-build']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodoffice-first-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install dependencies
        run: npm ci

      - name: Install universal Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Typecheck spreadsheet app
        run: npm run typecheck:goodoffice

      - name: Build unsigned GoodOffice DMG and ZIP
        run: npm run dist:goodoffice:mac

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GoodOffice-macOS-first-build
          path: release-goodoffice/*
          if-no-files-found: error
          retention-days: 14
