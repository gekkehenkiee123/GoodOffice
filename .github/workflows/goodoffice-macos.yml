name: GoodOffice macOS build

on:
  push:
    branches: ['goodoffice-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodoffice-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: goodoffice-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: goodoffice-electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install universal Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Typecheck GoodOffice
        run: npm run typecheck:goodoffice

      - name: Test spreadsheet engine and offline policy
        run: npm run test:goodoffice

      - name: Build unsigned macOS DMG and ZIP
        run: npm run dist:goodoffice:mac

      - name: Upload GoodOffice installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GoodOffice-macOS
          path: release-goodoffice/*
          if-no-files-found: error
          retention-days: 14
